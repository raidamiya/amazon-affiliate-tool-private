<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X アフィリエイト投稿ツール（Workers版） v2.8.2</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #1d9bf0;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f7f9fa;
            border-bottom: 2px solid #e1e8ed;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(29, 155, 240, 0.1);
        }

        .tab.active {
            color: #1d9bf0;
            background: white;
            border-bottom: 3px solid #1d9bf0;
        }

        .tab-content {
            display: none;
            padding: 25px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        input[type="url"],
        input[type="text"],
        input[type="search"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1d9bf0;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1d9bf0;
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 16px;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1a8cd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(29, 155, 240, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: white;
            color: #1d9bf0;
            border: 2px solid #1d9bf0;
        }

        .btn-outline:hover {
            background: #1d9bf0;
            color: white;
        }

        .btn-success {
            background: #10a37f;
            color: white;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .char-count {
            text-align: right;
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .char-count.warning {
            color: #f91880;
            font-weight: 600;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #e8f5e9;
            border: 2px solid #81c784;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .success.show {
            display: block;
        }

        .info {
            background: #e3f2fd;
            border: 2px solid #90caf9;
            color: #1565c0;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .info.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>
                🐦 X アフィリエイト投稿ツール
                <span style="background:#10a37f;padding:3px 8px;border-radius:4px;font-size:12px;">Workers版</span>
                <span style="background:#ff6b6b;padding:3px 8px;border-radius:4px;font-size:12px;margin-left:5px;">v2.8.2</span>
            </h1>
            <p>高精度な価格取得 × AI宣伝文生成 × 自動投稿</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('manual')">🔗 URL指定</button>
            <button class="tab" onclick="switchTab('trending')">💡 人気ワード</button>
            <button class="tab" onclick="switchTab('detailed')">⚡ 価格取得強化</button>
            <button class="tab" onclick="switchTab('ranking')">📊 ランキング</button>
            <button class="tab" onclick="switchTab('auto')">🤖 自動投稿</button>
            <button class="tab" onclick="switchTab('ai')">✨ AI宣伝文</button>
        </div>

        <!-- ========================= -->
        <!-- URL指定タブ -->
        <!-- ========================= -->

        <div id="manual-tab" class="tab-content active">
            <div class="form-group">
                <label>📦 Amazon商品URL</label>
                <input type="url" id="amazonUrl" placeholder="https://www.amazon.co.jp/dp/B0XXXXXXXXX">
            </div>

            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>📝 投稿テンプレート</label>
                <textarea id="customTemplate">{商品名}
詳細・最新価格はこちら⇒⇒
{リンク}

{タグ}</textarea>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useShortUrl" checked>
                    短縮URLを使用
                </label>
            </div>

            <button class="btn btn-primary" onclick="generateFromUrl()" id="generateBtn">
                ✨ 投稿文を生成
            </button>

            <div class="loading-inline" id="loading-manual" style="display:none;">
                <div class="spinner-small"></div>
                <span>生成中です...</span>
            </div>

            <div class="error" id="error-manual"></div>
            <div class="result" id="result-manual"></div>
            <div id="charCount-manual" class="char-count"></div>

            <div id="actions-manual" style="display:none;">
                <div class="button-group">
                    <button class="btn btn-success" onclick="postToX('manual')">🐦 Xで投稿する</button>
                    <button class="btn btn-outline" onclick="copyText('manual')">📋 コピー</button>
                </div>
            </div>
        </div>

        <!-- ========================= -->
        <!-- 人気ワードタブ -->
        <!-- ========================= -->

        <div id="trending-tab" class="tab-content">
            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-trending" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>💡 話題の商品ワード</label>
                <select id="trendingKeyword" class="keyword-select">
                    <option value="">-- 話題のワードを選択 --</option>
                </select>
                <button class="btn btn-outline" onclick="updateTrendingKeywords()" style="margin-top:10px;">🔄 更新</button>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useShortUrl-trending" checked>
                    短縮URLを使用
                </label>
            </div>

            <div class="error" id="error-trending"></div>
            <div class="success" id="success-trending"></div>
            <div class="info" id="info-trending"></div>

            <div id="bulk-actions-trending" class="bulk-actions" style="display:none;">
                <button class="btn btn-warning" onclick="startBulkPost('trending')">🚀 順番に投稿</button>
                <button class="btn btn-danger" onclick="resetPosted('trending')">🔄 リセット</button>
            </div>

            <div class="loading" id="trending-loading" style="display:none;">
                <div class="spinner"></div>
                <p>商品を検索中...</p>
            </div>

            <div id="trending-results" class="product-list"></div>
        </div>

        <!-- ========================= -->
        <!-- 価格取得強化タブ -->
        <!-- ========================= -->

        <div id="detailed-tab" class="tab-content">
            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-detailed" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>⚡ 商品検索キーワード</label>
                <div class="search-controls">
                    <input type="search" id="detailedQuery" placeholder="商品名やキーワードを入力">
                    <button class="btn btn-primary" onclick="detailedSearch()">⚡ 検索</button>
                </div>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useShortUrl-detailed" checked>
                    短縮URLを使用
                </label>
            </div>

            <div class="error" id="error-detailed"></div>
            <div class="success" id="success-detailed"></div>
            <div class="info" id="info-detailed"></div>

            <div id="bulk-actions-detailed" class="bulk-actions" style="display:none;">
                <button class="btn btn-warning" onclick="startBulkPost('detailed')">🚀 順番に投稿</button>
                <button class="btn btn-danger" onclick="resetPosted('detailed')">🔄 リセット</button>
            </div>

            <div class="loading" id="detailed-loading" style="display:none;">
                <div class="spinner"></div>
                <p id="detailed-progress">商品を詳細取得中...</p>
                <button class="btn btn-danger" onclick="cancelDetailedSearch()" style="margin-top:10px;">❌ キャンセル</button>
            </div>

            <div id="detailed-results" class="product-list"></div>
        </div>

        <!-- ========================= -->
        <!-- ランキングタブ -->
        <!-- ========================= -->

        <div id="ranking-tab" class="tab-content">
            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-ranking" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>📊 カテゴリ選択</label>
                <div class="ranking-controls">
                    <select id="category" onchange="updateCategoryUrl()">
                        <option value="bestsellers">総合ベストセラー</option>
                        <option value="kitchen">ホーム&キッチン</option>
                        <option value="electronics">家電&カメラ</option>
                        <option value="computers">パソコン・周辺機器</option>
                        <option value="books">本</option>
                        <option value="dvd">DVD・ミュージック</option>
                        <option value="toys">おもちゃ</option>
                        <option value="hobby">ホビー</option>
                        <option value="sports">スポーツ&アウトドア</option>
                        <option value="diy">DIY・工具</option>
                        <option value="food">食品・飲料</option>
                        <option value="beauty">ビューティー</option>
                        <option value="fashion">ファッション</option>
                        <option value="jewelry">ジュエリー</option>
                        <option value="shoes">シューズ&バッグ</option>
                        <option value="pet">ペット用品</option>
                        <option value="baby">ベビー&マタニティ</option>
                        <option value="custom">カスタムURL</option>
                    </select>

                    <button class="btn btn-primary" onclick="fetchRanking()">📊 取得</button>
                </div>
            </div>

            <div class="form-group" id="custom-url-group" style="display:none;">
                <label>カスタムランキングURL</label>
                <input type="url" id="customRankingUrl" placeholder="https://www.amazon.co.jp/gp/bestsellers/...">
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useShortUrl-ranking" checked>
                    短縮URLを使用
                </label>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useDeepFetch-ranking">
                    ⚡ 価格取得強化モード
                </label>
            </div>

            <div class="error" id="error-ranking"></div>
            <div class="success" id="success-ranking"></div>
            <div class="info" id="info-ranking"></div>

            <div id="bulk-actions-ranking" class="bulk-actions" style="display:none;">
                <button class="btn btn-warning" onclick="startBulkPost('ranking')">🚀 順番に投稿</button>
                <button class="btn btn-danger" onclick="resetPosted('ranking')">🔄 リセット</button>
            </div>

            <div class="loading" id="ranking-loading" style="display:none;">
                <div class="spinner"></div>
                <p>ランキング取得中...</p>
            </div>

            <div id="product-list" class="product-list"></div>
        </div>

        <!-- ========================= -->
        <!-- 自動投稿タブ -->
        <!-- ========================= -->

        <div id="auto-tab" class="tab-content">
            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-auto" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>🔑 キーワードリスト（1行1キーワード）</label>
                <textarea id="keyword-list" placeholder="イヤホン
プロテイン
タオル"></textarea>
            </div>

            <div class="form-group">
                <label>⏱️ 投稿間隔（分）</label>
                <input type="number" id="post-interval" value="30" min="1">
            </div>

            <div class="form-group">
                <label>📌 1キーワードあたりの投稿数</label>
                <input type="number" id="posts-per-keyword" value="3" min="1">
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="auto-use-trending">
                    人気ワードを自動取得して使用
                </label>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="auto-skip-no-price">
                    価格が取得できない商品をスキップ
                </label>
            </div>
            
            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="avoid-duplicate-keywords">
                    使用済みキーワードを避ける
                </label>
            </div>
            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="auto-use-ai" checked>
                    🤖 AIで宣伝文を生成する（OpenRouter）
                </label>
            </div>
            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="auto-mode-enabled">
                    🤖 完全自動モード（Tampermonkey）
                </label>
            </div>

            <div class="form-group" id="confirm-time-group" style="display:none;">
                <label>⏳ 自動投稿の確認時間（秒）</label>
                <input type="number" id="confirm-time" value="3" min="1">
            </div>

            <button id="auto-start-btn" class="btn btn-primary" onclick="autoPoster.start()">🚀 自動投稿開始</button>
            <button id="auto-stop-btn" class="btn btn-danger" onclick="autoPoster.stop()" style="display:none;">⛔ 停止</button>

            <div id="auto-status" style="display:none; margin-top:20px;">
                <p>現在のキーワード: <span id="current-keyword">-</span></p>
                <p>次の投稿予定時刻: <span id="next-post-info">-</span></p>
                <p>残り時間: <span id="auto-timer">--:--</span></p>

                <div style="margin-top:10px;">
                    <strong>投稿進捗</strong>
                    <div style="background:#eee; height:10px; border-radius:5px; margin-top:5px;">
                        <div id="progress-bar" style="height:10px; width:0%; background:#1d9bf0; border-radius:5px;"></div>
                    </div>
                </div>

                <div style="margin-top:10px;">
                    <p>総投稿数: <span id="stat-total">0</span></p>
                    <p>成功: <span id="stat-success">0</span> / 失敗: <span id="stat-failed">0</span></p>
                </div>
            </div>

            <div id="auto-log" style="display:none; margin-top:20px; background:#f7f9fa; border:1px solid #ddd; padding:10px; height:200px; overflow-y:auto;">
                <div id="log-content"></div>
            </div>
        </div>

        <!-- ========================= -->
        <!-- AI宣伝文タブ -->
        <!-- ========================= -->

        <div id="ai-tab" class="tab-content">
            <div class="info-box" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <strong>✨ AI自動生成（v2.7 最適化版）</strong><br>
                商品URLを入力すると、AIが180文字以内の宣伝文を生成します。
            </div>

            <div class="form-group">
                <label>🤖 使用するAIモデル</label>
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <button class="btn btn-outline" onclick="selectAIModel('gemini')" id="ai-btn-gemini" style="flex:1;">✨ Gemini</button>
                    <button class="btn btn-outline" onclick="selectAIModel('grok')" id="ai-btn-grok" style="flex:1;">⚡ Grok</button>
                    <button class="btn btn-outline" onclick="selectAIModel('openrouter')" id="ai-btn-openrouter" style="flex:1;">🌐 OpenRouter</button>
                </div>
                <small id="ai-model-description" style="color:#666; font-size:12px;">
                    AIモデルを選択してください
                </small>
            </div>

            <div class="form-group" id="openrouter-model-selector" style="display:none;">
                <label>🎯 OpenRouterモデル</label>
                <select id="openrouter-model" style="width:100%; padding:10px; border:2px solid #e1e8ed; border-radius:8px;">
                    <option value="openrouter/free">✨ 自動選択（推奨・無料）</option>
                    <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B（無料）</option>
                    <option value="deepseek/deepseek-chat-v3-0324:free">DeepSeek Chat v3（無料）</option>
                    <option value="deepseek/deepseek-r1-0528:free">DeepSeek R1（無料）</option>
                    <option value="qwen/qwen3-4b:free">Qwen 3 4B（無料）</option>
                </select>
            </div>

            <div class="form-group">
                <label id="ai-key-label">🔑 API Key</label>
                <input type="password" id="ai-api-key" placeholder="APIキーを入力">
                <small id="ai-key-link" style="color:#666; font-size:12px;"></small>
            </div>

            <div class="form-group">
                <label>📦 Amazon商品URL</label>
                <input type="url" id="ai-product-url" placeholder="https://www.amazon.co.jp/dp/B0XXXXXXXXX">
            </div>

            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-ai" placeholder="yourname-22">
            </div>

            <button class="btn btn-primary" onclick="generateAIPost()" id="generate-ai-btn">
                ✨ AI宣伝文を生成
            </button>

            <div class="loading-inline" id="loading-ai" style="display:none;">
                <div class="spinner-small"></div>
                <span id="ai-loading-text">AIが宣伝文を生成中...</span>
            </div>

            <div class="error" id="error-ai"></div>

            <div id="ai-result-container" style="display:none; margin-top:20px;">
                <div class="form-group">
                    <label>📝 生成された宣伝文（編集可能）</label>
                    <textarea id="ai-generated-text" style="min-height:200px;" oninput="updateCharCount(this.value, 'ai')"></textarea>
                </div>

                <div id="charCount-ai" class="char-count"></div>

                <div class="button-group">
                    <button class="btn btn-success" onclick="postToX('ai')">🐦 Xで投稿する</button>
                    <button class="btn btn-outline" onclick="copyText('ai')">📋 コピー</button>
                    <button class="btn btn-warning" onclick="regenerateAIPost()">🔄 再生成</button>
                </div>
            </div>
        </div>

        <!-- ========================= -->
        <!-- ここから JavaScript 開始 -->
        <!-- ========================= -->

        <script>
        let currentPostText = {
            manual: "",
            trending: "",
            detailed: "",
            ranking: "",
            ai: ""
        };

        let currentProducts = {
            trending: [],
            detailed: [],
            ranking: []
        };

        let postedProducts = {
            trending: new Set(),
            detailed: new Set(),
            ranking: new Set()
        };

        function switchTab(tab) {
            document.querySelectorAll(".tab").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");

            document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
            document.getElementById(tab + "-tab").classList.add("active");
        }

        /* ============================
           AIモデル選択
        ============================ */

        let currentAIModel = "gemini";
        let currentAIPrompt = "";

        function selectAIModel(model) {
            currentAIModel = model;

            const geminiBtn = document.getElementById("ai-btn-gemini");
            const grokBtn = document.getElementById("ai-btn-grok");
            const openrouterBtn = document.getElementById("ai-btn-openrouter");
            const apiKeyLabel = document.getElementById("ai-key-label");
            const apiKeyInput = document.getElementById("ai-api-key");
            const apiKeyLink = document.getElementById("ai-key-link");
            const modelDesc = document.getElementById("ai-model-description");
            const modelSelector = document.getElementById("openrouter-model-selector");

            [geminiBtn, grokBtn, openrouterBtn].forEach(btn => {
                btn.classList.remove("btn-primary");
                btn.classList.add("btn-outline");
            });

            if (model === "gemini") {
                geminiBtn.classList.add("btn-primary");
                geminiBtn.classList.remove("btn-outline");
                modelSelector.style.display = "none";

                apiKeyLabel.textContent = "🔑 Gemini API Key";
                apiKeyInput.placeholder = "AIzaSy...";

        /* ============================
		   Gemini API（v2.7 修正版）
		============================ */

		async function callGeminiAPI(apiKey, prompt) {
		    const url = "https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent";

		    const body = {
		        contents: [
		            {
		                role: "user",
		                parts: [{ text: prompt }]
		            }
		        ],
		        generationConfig: {
		            temperature: 0.9,
		            maxOutputTokens: 1024
		        }
		    };

		    const res = await fetch(`${url}?key=${apiKey}`, {
		        method: "POST",
		        headers: { "Content-Type": "application/json" },
		        body: JSON.stringify(body)
		    });

		    if (!res.ok) {
		        const err = await res.text();
		        throw new Error("Gemini API error: " + res.status + " / " + err);
		    }

		    const data = await res.json();

		    // 安全にテキストを抽出
		    if (
		        !data.candidates ||
		        !data.candidates[0] ||
		        !data.candidates[0].content ||
		        !data.candidates[0].content.parts
		    ) {
		        throw new Error("Gemini API response invalid");
		    }

		    return data.candidates[0].content.parts
		        .map(part => part.text || "")
		        .join("")
		        .trim();
		}

        async function callGrokAPI(apiKey, prompt) {

        /* ============================
           OpenRouter API
        ============================ */

        async function callOpenRouterAPI(apiKey, prompt, model) {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + apiKey,
                    "HTTP-Referer": window.location.href,
                    "X-Title": "Amazon Affiliate Tool"
                },
                body: JSON.stringify({
                    messages: [{ role: "user", content: prompt }],
                    model: model,
                    temperature: 0.9
                })
            });

            const json = await res.json();

            if (json.error) {
                throw new Error(json.error.message || "OpenRouter error");
            }

            if (!json.choices || !json.choices[0].message) {
                throw new Error("OpenRouter response invalid");
            }

            return json.choices[0].message.content.trim();
        }

        /* ============================

        function extractASIN(url) {
            const match = url.match(/\/dp\/([A-Z0-9]{10})|\/gp\/product\/([A-Z0-9]{10})/);
            return match ? (match[1] || match[2]) : null;
        }

        async function fetchProductInfo(url) {

            const productUrl = `https://www.amazon.co.jp/dp/${asin}`;
            const html = await fetchWithProxy(productUrl);

            let price = "";

            if (priceElem) {
                const m = priceElem.textContent.match(/[\d,]+/);
                if (m) price = parseInt(m[0].replace(/,/g, "")) + "円";
            }

            let rating = "";

            if (discountElem) {

                if (m) discount = m[1] + "%OFF";
            }

            return {
                title: title || `Amazon商品（ASIN: ${asin}）`,
                price,
                rating,
                discount,
                asin

            /* ============================================================
            Amazonリアルタイムランキングから人気ワードを抽出（v2.8）
            ============================================================ */

            async function getTrendingKeywordsFromAmazon(limit = 10) {
                const rankingUrl = "https://www.amazon.co.jp/gp/bestsellers";

                try {
                    const html = await fetchWithProxy(rankingUrl);
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, "text/html");

                    const items = doc.querySelectorAll(".zg-grid-general-faceout, .p13n-sc-uncoverable-faceout, li[data-asin]");
                    const keywords = [];

                    for (let i = 0; i < Math.min(items.length, 30); i++) {
                        const item = items[i];

                        const titleElem = item.querySelector("img")?.getAttribute("alt")
                            || item.querySelector("div > a > span")
                            || item.querySelector("h2, h3");

                        if (!titleElem) continue;

                        const title = (titleElem.textContent || titleElem).trim();

                        // 商品名からキーワード抽出（名詞っぽい単語を抽出）
                        const extracted = extractKeywordFromTitle(title);
                        if (extracted && !keywords.includes(extracted)) {
                            keywords.push(extracted);
                        }

                        if (keywords.length >= limit) break;
                    }

                    return keywords;

                } catch (e) {
                    console.error("ランキング取得エラー:", e);
                    return [];
                }
            }

            /* ============================================================
            商品タイトルからキーワード抽出
            ============================================================ */

            function extractKeywordFromTitle(title) {
                if (!title) return null;

                // 記号で分割
                let parts = title.split(/[\s・\-\[\]\(\)【】]/g);

                // 長すぎる単語や短すぎる単語を除外
                parts = parts.filter(p =>
                    p.length >= 2 &&
                    p.length <= 20 &&
                    !p.match(/^\d+$/) &&         // 数字だけ
                    !p.match(/^(Amazon|ランキング|ベストセラー)$/i)
                );

                // 最初の名詞っぽい単語を返す
                return parts[0] || null;
            }

                    }

                    - 箇条書きには ✔ を使用
                    - 絵文字は 2〜4 個
                    - ハッシュタグは #Amazon を含めて 2〜4 個
                    - 180 文字以内
                    - URL は文末に置く
                    - 「はい、〜します」などの前置きは禁止
                    - 「以下が宣伝文です」などの説明も禁止
                    - 宣伝文以外の文章を一切出力しない

                    【出力形式】
                    宣伝文のみをそのまま出力。
                    `.trim();

                    try {
                        const aiText = await callOpenRouterAPI(apiKey, prompt, model);
                        return aiText.length > 180 ? aiText.substring(0, 177) + "…" : aiText;
                    } catch (e) {
                        this.log("❌ AI生成失敗: " + e.message, "error");
                        return null;
                    }
                }

                // AIを使わない場合
                const info = {
                    title: product.title,
                    price: product.price || "",
                    rating: "",
                    discount: ""
                };

                return createSimplePostText(info, shortUrl, "twitter");
            }

            /* ------------------------------------
            Workers版 Amazon検索（商品詳細ページで補完）
            ------------------------------------ */
            async searchProductsWithWorkers(keyword) {
                const url = `https://www.amazon.co.jp/s?k=${encodeURIComponent(keyword)}`;
                const html = await fetchWithProxy(url);

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");

                const items = doc.querySelectorAll('[data-asin]');
                const results = [];

                for (let i = 0; i < Math.min(items.length, 5); i++) {
                    const asin = items[i].getAttribute("data-asin");
                    if (!asin) continue;

                    // 商品詳細ページを再取得（ここが重要）
                    const detailUrl = `https://www.amazon.co.jp/dp/${asin}`;
                    const detailHtml = await fetchWithProxy(detailUrl);
                    const detailDoc = parser.parseFromString(detailHtml, "text/html");

                    const titleElem = detailDoc.querySelector("#productTitle");
                    const title = titleElem ? titleElem.textContent.trim() : "商品名不明";

                    const priceElem = detailDoc.querySelector(".a-price .a-offscreen");
                    let price = "";
                    if (priceElem) {
                        const m = priceElem.textContent.match(/[\d,]+/);
                        if (m) price = parseInt(m[0].replace(/,/g, "")) + "円";
                    }

                    results.push({
                        asin,
                        title,
                        price,
                        url: detailUrl
                    });

                    // Amazonに優しいウェイト
                    await new Promise(r => setTimeout(r, 1500));
                }

                return results;
            }

            /* ------------------------------------
            次のキーワードへ
            ------------------------------------ */
            moveToNextKeyword() {
                this.currentProductIndex = 0;
                this.currentKeywordIndex++;

                if (this.currentKeywordIndex >= this.keywords.length) {
                    this.currentKeywordIndex = 0;
                }
            }

            /* ------------------------------------
            次回投稿のスケジュール
            ------------------------------------ */
            scheduleNext() {
                if (!this.isRunning) return;

                this.nextPostTime = new Date(Date.now() + this.interval * 60000);
                this.log(`⏳ 次の投稿まで ${this.interval} 分`, "info");

                this.timerId = setTimeout(() => this.processNext(), this.interval * 60000);
            }

            /* ------------------------------------
            X投稿画面を開く
            ------------------------------------ */
            openTwitterPost(text) {
                const encoded = encodeURIComponent(text);
                const autoMode = document.getElementById("auto-mode-enabled").checked;
                const confirmTime = document.getElementById("confirm-time").value || "3";

                let url = `https://twitter.com/intent/tweet?text=${encoded}`;

                if (autoMode) {
                    url += `&autopost=1&confirmtime=${confirmTime}`;
                }

                window.open(url, "_blank", "width=600,height=400");
            }

            /* ------------------------------------
            ログ
            ------------------------------------ */
            log(message, type = "info") {
                const logContainer = document.getElementById("auto-log");
                const logContent = document.getElementById("log-content");

                logContainer.style.display = "block";

                const entry = document.createElement("div");
                entry.textContent = message;

                entry.style.color =
                    type === "success" ? "#10a37f" :
                    type === "error" ? "#f44336" :
                    type === "warning" ? "#ff9800" :
                    "#333";

                logContent.appendChild(entry);
                logContent.scrollTop = logContent.scrollHeight;
            }
        }

        /* ------------------------------------
        インスタンス生成
        ------------------------------------ */
        const autoPoster = new AutoPosterManager();
        </script>

    </div>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X アフィリエイト投稿ツール (PA-API版)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: #1d9bf0;
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .badge {
            background: #10a37f;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
            margin-left: 10px;
        }
        
        .config-section {
            background: #f7f9fa;
            border-bottom: 2px solid #e1e8ed;
            padding: 20px 25px;
        }
        
        .config-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
            max-width: 400px;
        }
        
        .config-item label {
            font-size: 12px;
            font-weight: 600;
            color: #666;
        }
        
        .config-item input {
            padding: 8px 12px;
            border: 2px solid #e1e8ed;
            border-radius: 6px;
            font-size: 13px;
        }
        
        .config-item input:focus {
            outline: none;
            border-color: #1d9bf0;
        }
        
        .tabs {
            display: flex;
            background: #f7f9fa;
            border-bottom: 2px solid #e1e8ed;
        }
        
        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: rgba(29, 155, 240, 0.1);
        }
        
        .tab.active {
            color: #1d9bf0;
            background: white;
            border-bottom: 3px solid #1d9bf0;
        }
        
        .tab-content {
            display: none;
            padding: 25px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="search"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        
        input:focus,
        select:focus {
            outline: none;
            border-color: #1d9bf0;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #1d9bf0;
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 16px;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #1a8cd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(29, 155, 240, 0.3);
        }
        
        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-small {
            background: #1d9bf0;
            color: white;
            padding: 8px 16px;
            font-size: 13px;
        }
        
        .btn-small:hover {
            background: #1a8cd8;
        }
        
        .btn-success {
            background: #10a37f;
            color: white;
        }
        
        .btn-success:hover {
            background: #0d8968;
        }
        
        .btn-warning {
            background: #ff9800;
            color: white;
        }
        
        .btn-warning:hover {
            background: #f57c00;
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover {
            background: #d32f2f;
        }
        
        .search-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: stretch;
        }
        
        .search-controls input {
            flex: 3;
            min-width: 0;
        }
        
        .search-controls .btn {
            flex: 1;
            min-width: 100px;
            white-space: nowrap;
        }
        
        .ranking-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: stretch;
        }
        
        .ranking-controls select {
            flex: 3;
            min-width: 0;
        }
        
        .ranking-controls .btn {
            flex: 1;
            min-width: 100px;
            white-space: nowrap;
        }
        
        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .bulk-actions .btn {
            flex: 1;
        }
        
        .product-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }
        
        .product-item {
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            gap: 15px;
            transition: all 0.3s;
            background: white;
            position: relative;
        }
        
        .product-item:hover {
            border-color: #1d9bf0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .product-item.posted {
            background: #f0f8ff;
            border-color: #10a37f;
        }
        
        .product-image {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 5px;
            background: #f7f9fa;
        }
        
        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }
        
        .product-rank {
            display: inline-block;
            background: #ffd700;
            color: #333;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 700;
        }
        
        .product-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            line-height: 1.4;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-word;
        }
        
        .product-price {
            font-size: 16px;
            color: #B12704;
            font-weight: 700;
        }
        
        .product-rating {
            font-size: 13px;
            color: #FFA41C;
        }
        
        .product-actions {
            display: flex;
            gap: 5px;
            margin-top: auto;
            flex-wrap: wrap;
        }
        
        .posted-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #10a37f;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .posted-badge:hover {
            background: #0d8968;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1d9bf0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .success {
            background: #e8f5e9;
            border: 2px solid #81c784;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        
        .success.show {
            display: block;
        }
        
        .info {
            background: #e3f2fd;
            border: 2px solid #90caf9;
            color: #1565c0;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }
        
        .info.show {
            display: block;
        }
        
        .tips {
            background: #e8f5fe;
            border-left: 4px solid #1d9bf0;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .tips strong {
            color: #1d9bf0;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .button-group .btn {
            flex: 1;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            text-align: center;
        }
        
        .modal-content h3 {
            margin-bottom: 20px;
            color: #333;
        }
        
        .modal-content p {
            margin-bottom: 20px;
            color: #666;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        @media (max-width: 768px) {
            .product-item {
                flex-direction: column;
                text-align: center;
            }
            
            .product-image {
                width: 100%;
                height: 150px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .ranking-controls,
            .search-controls {
                flex-direction: column;
            }
            
            .tabs {
                flex-wrap: wrap;
            }
            
            .tab {
                font-size: 12px;
                padding: 12px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐦 X アフィリエイト投稿ツール<span class="badge">PA-API版</span></h1>
            <p>高精度な商品情報取得 - Cloudflare Workers経由</p>
        </div>
        
        <!-- 設定 -->
        <div class="config-section">
            <div class="config-item">
                <label>🏷️ Associate Tag</label>
                <input type="text" id="associateTag" value="raida5963-22" placeholder="yourname-22">
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('search')">🔍 商品検索</button>
            <button class="tab" onclick="switchTab('ranking')">📊 ベストセラー</button>
        </div>
        
        <!-- 検索タブ -->
        <div id="search-tab" class="tab-content active">
            <div class="form-group">
                <label>🔍 商品検索キーワード</label>
                <div class="search-controls">
                    <input type="search" id="searchQuery" placeholder="商品名やキーワードを入力">
                    <button class="btn btn-primary" onclick="searchProducts()">
                        🔍 検索
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="useShortUrl-search" checked style="width: auto;">
                    短縮URLを使用
                </label>
            </div>
            
            <div class="error" id="error-search"></div>
            <div class="success" id="success-search"></div>
            <div class="info" id="info-search"></div>
            
            <div id="bulk-actions-search" class="bulk-actions" style="display: none;">
                <button class="btn btn-warning" onclick="startBulkPost('search')">
                    🚀 順番に投稿
                </button>
                <button class="btn btn-danger" onclick="resetPosted('search')">
                    🔄 リセット
                </button>
            </div>
            
            <div class="loading" id="search-loading" style="display: none;">
                <div class="spinner"></div>
                <p>PA-APIで商品を検索中...</p>
            </div>
            
            <div id="search-results" class="product-list"></div>
            
            <div class="tips">
                <strong>⚡ PA-API版の特長：</strong><br>
                • 正確な価格取得（ほぼ100%）<br>
                • 高画質な商品画像<br>
                • 詳細なレビュー情報<br>
                • 高速な取得速度<br>
                • 🔒 安全（Secret Keyは公開されません）
            </div>
        </div>
        
        <!-- ランキングタブ -->
        <div id="ranking-tab" class="tab-content">
            <div class="form-group">
                <label>📊 カテゴリ選択</label>
                <div class="ranking-controls">
                    <select id="category">
                        <option value="All">すべてのカテゴリ</option>
                        <option value="Books">本</option>
                        <option value="Electronics">家電&カメラ</option>
                        <option value="Computers">パソコン・周辺機器</option>
                        <option value="KindleStore">Kindleストア</option>
                        <option value="Music">ミュージック</option>
                        <option value="VideoGames">ゲーム</option>
                        <option value="Toys">おもちゃ</option>
                        <option value="Sports">スポーツ&アウトドア</option>
                        <option value="Kitchen">ホーム&キッチン</option>
                        <option value="Beauty">ビューティー</option>
                        <option value="Fashion">ファッション</option>
                    </select>
                    <button class="btn btn-primary" onclick="fetchBestsellers()">
                        📊 取得
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="useShortUrl-ranking" checked style="width: auto;">
                    短縮URLを使用
                </label>
            </div>
            
            <div class="error" id="error-ranking"></div>
            <div class="success" id="success-ranking"></div>
            <div class="info" id="info-ranking"></div>
            
            <div id="bulk-actions-ranking" class="bulk-actions" style="display: none;">
                <button class="btn btn-warning" onclick="startBulkPost('ranking')">
                    🚀 順番に投稿
                </button>
                <button class="btn btn-danger" onclick="resetPosted('ranking')">
                    🔄 リセット
                </button>
            </div>
            
            <div id="ranking-loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>ベストセラーを取得中...</p>
            </div>
            
            <div id="product-list" class="product-list"></div>
            
            <div class="tips">
                <strong>💡 注意：</strong><br>
                PA-APIのベストセラー取得は検索ベースです。<br>
                正確なランキング順位は取得できません。
            </div>
        </div>
    </div>
    
    <!-- モーダル -->
    <div id="bulk-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">投稿の準備ができました</h3>
            <p id="modal-message">投稿画面を開きます</p>
            <div class="modal-buttons button-group">
                <button class="btn btn-success" onclick="postCurrentProduct()">
                    🐦 投稿画面を開く
                </button>
                <button class="btn btn-primary" onclick="nextProduct()">
                    ➡️ 次へ
                </button>
                <button class="btn btn-outline" onclick="cancelBulkPost()">
                    ❌ 中止
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Cloudflare Workers エンドポイント
        const WORKER_URL = 'https://amazon-paapi-proxy.carpe-diem-miya.workers.dev';
        
        let currentProducts = {
            search: [],
            ranking: []
        };
        
        let postedProducts = {
            search: new Set(),
            ranking: new Set()
        };
        
        let bulkPostState = {
            active: false,
            tab: '',
            currentIndex: 0,
            products: []
        };
        
        window.onload = function() {
            const savedTag = localStorage.getItem('paapi_tag');
            if (savedTag) {
                document.getElementById('associateTag').value = savedTag;
            }
        };
        
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName + '-tab').classList.add('active');
        }
        
        function saveConfig() {
            const tag = document.getElementById('associateTag').value.trim();
            localStorage.setItem('paapi_tag', tag);
            return { tag };
        }
        
        async function shortenUrl(longUrl) {
            try {
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                if (response.ok) {
                    return await response.text();
                }
            } catch (error) {
                console.error('短縮URL生成失敗:', error);
            }
            return longUrl;
        }
        
        async function callPAAPI(operation, params) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        operation: operation,
                        params: params
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('PA-API Error:', errorText);
                    throw new Error(`PA-API Error: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('Worker Error:', error);
                throw error;
            }
        }
        
        async function searchProducts() {
            const query = document.getElementById('searchQuery').value.trim();
            
            if (!query) {
                showError('search', '検索キーワードを入力してください');
                return;
            }
            
            saveConfig();
            
            document.getElementById('search-loading').style.display = 'block';
            document.getElementById('search-results').innerHTML = '';
            document.getElementById('bulk-actions-search').style.display = 'none';
            hideError('search');
            hideSuccess('search');
            hideInfo('search');
            postedProducts.search.clear();
            
            try {
                const response = await callPAAPI('SearchItems', {
                    Keywords: query,
                    ItemCount: 10,
                    Resources: [
                        'Images.Primary.Large',
                        'ItemInfo.Title',
                        'Offers.Listings.Price',
                        'Offers.Listings.SavingBasis',
                        'CustomerReviews.StarRating'
                    ]
                });
                
                if (!response.SearchResult || !response.SearchResult.Items) {
                    throw new Error('商品が見つかりませんでした');
                }
                
                const products = response.SearchResult.Items.map((item, index) => {
                    const title = item.ItemInfo?.Title?.DisplayValue || 'タイトル不明';
                    const asin = item.ASIN;
                    const imageUrl = item.Images?.Primary?.Large?.URL || '';
                    
                    let price = '';
                    if (item.Offers?.Listings && item.Offers.Listings.length > 0) {
                        const listing = item.Offers.Listings[0];
                        if (listing.Price) {
                            price = `${listing.Price.Amount.toLocaleString()}円`;
                        }
                    }
                    
                    let rating = '';
                    if (item.CustomerReviews?.StarRating) {
                        rating = `★${item.CustomerReviews.StarRating.Value}`;
                    }
                    
                    return {
                        rank: index + 1,
                        asin: asin,
                        url: `https://www.amazon.co.jp/dp/${asin}`,
                        imageUrl: imageUrl,
                        title: title,
                        price: price,
                        rating: rating
                    };
                });
                
                currentProducts.search = products;
                await displayProducts(products, 'search');
                
                if (products.length > 0) {
                    document.getElementById('bulk-actions-search').style.display = 'block';
                    showInfo('search', `✅ ${products.length}件の商品を取得しました`);
                }
                
            } catch (error) {
                showError('search', '検索に失敗しました: ' + error.message);
            } finally {
                document.getElementById('search-loading').style.display = 'none';
            }
        }
        
        async function fetchBestsellers() {
            const category = document.getElementById('category').value;
            
            saveConfig();
            
            document.getElementById('ranking-loading').style.display = 'block';
            document.getElementById('product-list').innerHTML = '';
            document.getElementById('bulk-actions-ranking').style.display = 'none';
            hideError('ranking');
            hideSuccess('ranking');
            hideInfo('ranking');
            postedProducts.ranking.clear();
            
            try {
                const response = await callPAAPI('SearchItems', {
                    Keywords: 'ベストセラー',
                    SearchIndex: category,
                    ItemCount: 10,
                    Resources: [
                        'Images.Primary.Large',
                        'ItemInfo.Title',
                        'Offers.Listings.Price',
                        'CustomerReviews.StarRating'
                    ]
                });
                
                if (!response.SearchResult || !response.SearchResult.Items) {
                    throw new Error('商品が見つかりませんでした');
                }
                
                const products = response.SearchResult.Items.map((item, index) => {
                    const title = item.ItemInfo?.Title?.DisplayValue || 'タイトル不明';
                    const asin = item.ASIN;
                    const imageUrl = item.Images?.Primary?.Large?.URL || '';
                    
                    let price = '';
                    if (item.Offers?.Listings && item.Offers.Listings.length > 0) {
                        const listing = item.Offers.Listings[0];
                        if (listing.Price) {
                            price = `${listing.Price.Amount.toLocaleString()}円`;
                        }
                    }
                    
                    let rating = '';
                    if (item.CustomerReviews?.StarRating) {
                        rating = `★${item.CustomerReviews.StarRating.Value}`;
                    }
                    
                    return {
                        rank: index + 1,
                        asin: asin,
                        url: `https://www.amazon.co.jp/dp/${asin}`,
                        imageUrl: imageUrl,
                        title: title,
                        price: price,
                        rating: rating
                    };
                });
                
                currentProducts.ranking = products;
                await displayProducts(products, 'ranking');
                
                if (products.length > 0) {
                    document.getElementById('bulk-actions-ranking').style.display = 'block';
                    showInfo('ranking', `✅ ${products.length}件の商品を取得しました`);
                }
                
            } catch (error) {
                showError('ranking', '取得に失敗しました: ' + error.message);
            } finally {
                document.getElementById('ranking-loading').style.display = 'none';
            }
        }
        
        async function displayProducts(products, tab) {
            const listId = tab === 'ranking' ? 'product-list' : 'search-results';
            const listDiv = document.getElementById(listId);
            listDiv.innerHTML = '';
            
            for (const product of products) {
                const productDiv = document.createElement('div');
                productDiv.className = 'product-item';
                productDiv.id = `product-${tab}-${product.asin}`;
                productDiv.innerHTML = `
                    <img src="${product.imageUrl}" alt="${product.title}" class="product-image">
                    <div class="product-info">
                        <div>
                            <span class="product-rank">#${product.rank}</span>
                        </div>
                        <div class="product-title">${product.title}</div>
                        ${product.price ? `<div class="product-price">${product.price}</div>` : '<div class="product-price" style="color: #666;">価格情報なし</div>'}
                        ${product.rating ? `<div class="product-rating">${product.rating}</div>` : ''}
                        <div class="product-actions">
                            <button class="btn btn-small btn-success" onclick="window.open('${product.url}', '_blank')" style="flex: 1;">
                                👁️ 確認
                            </button>
                            <button class="btn btn-small" onclick='generateAndPostProduct(${JSON.stringify(product).replace(/'/g, "&apos;")}, "${tab}")' style="flex: 1;">
                                ✨ 投稿
                            </button>
                        </div>
                    </div>
                `;
                listDiv.appendChild(productDiv);
            }
        }
        
        function startBulkPost(tab) {
            const products = currentProducts[tab].filter(p => !postedProducts[tab].has(p.asin));
            
            if (products.length === 0) {
                showError(tab, 'すべて投稿済みです');
                return;
            }
            
            bulkPostState = {
                active: true,
                tab: tab,
                currentIndex: 0,
                products: products
            };
            
            showBulkModal();
        }
        
        function showBulkModal() {
            if (!bulkPostState.active || bulkPostState.currentIndex >= bulkPostState.products.length) {
                cancelBulkPost();
                return;
            }
            
            const product = bulkPostState.products[bulkPostState.currentIndex];
            const remaining = bulkPostState.products.length - bulkPostState.currentIndex;
            
            document.getElementById('modal-title').textContent = `商品 ${bulkPostState.currentIndex + 1} / ${bulkPostState.products.length}`;
            document.getElementById('modal-message').textContent = `${product.title.substring(0, 60)}...\n\n残り ${remaining} 件`;
            document.getElementById('bulk-modal').classList.add('show');
        }
        
        function postCurrentProduct() {
            const product = bulkPostState.products[bulkPostState.currentIndex];
            const tab = bulkPostState.tab;
            
            generateAndPostProduct(product, tab, false);
        }
        
        function nextProduct() {
            const product = bulkPostState.products[bulkPostState.currentIndex];
            const tab = bulkPostState.tab;
            
            markAsPosted(product.asin, tab);
            
            bulkPostState.currentIndex++;
            
            if (bulkPostState.currentIndex >= bulkPostState.products.length) {
                showSuccess(tab, `${bulkPostState.products.length}件の投稿が完了しました！`);
                cancelBulkPost();
            } else {
                showBulkModal();
            }
        }
        
        function cancelBulkPost() {
            bulkPostState.active = false;
            document.getElementById('bulk-modal').classList.remove('show');
        }
        
        function markAsPosted(asin, tab) {
            postedProducts[tab].add(asin);
            
            const productDiv = document.getElementById(`product-${tab}-${asin}`);
            if (productDiv) {
                productDiv.classList.add('posted');
                
                if (!productDiv.querySelector('.posted-badge')) {
                    const badge = document.createElement('div');
                    badge.className = 'posted-badge';
                    badge.textContent = '✓ 投稿済み';
                    badge.onclick = () => unmarkPosted(asin, tab);
                    badge.title = 'クリックで解除';
                    productDiv.appendChild(badge);
                }
            }
        }
        
        function unmarkPosted(asin, tab) {
            postedProducts[tab].delete(asin);
            
            const productDiv = document.getElementById(`product-${tab}-${asin}`);
            if (productDiv) {
                productDiv.classList.remove('posted');
                const badge = productDiv.querySelector('.posted-badge');
                if (badge) {
                    badge.remove();
                }
            }
        }
        
        function resetPosted(tab) {
            if (confirm('すべての投稿済みマークを解除しますか？')) {
                postedProducts[tab].clear();
                
                const listId = tab === 'ranking' ? 'product-list' : 'search-results';
                const productDivs = document.querySelectorAll(`#${listId} .product-item`);
                
                productDivs.forEach(div => {
                    div.classList.remove('posted');
                    const badge = div.querySelector('.posted-badge');
                    if (badge) {
                        badge.remove();
                    }
                });
                
                showSuccess(tab, '投稿済みマークをすべて解除しました');
            }
        }
        
        async function generateAndPostProduct(product, tab, markPosted = true) {
            const config = saveConfig();
            const useShortUrlId = tab === 'ranking' ? 'useShortUrl-ranking' : 'useShortUrl-search';
            const useShortUrl = document.getElementById(useShortUrlId).checked;
            
            try {
                let affiliateLink = `https://www.amazon.co.jp/dp/${product.asin}?tag=${config.tag}`;
                
                if (useShortUrl) {
                    affiliateLink = await shortenUrl(affiliateLink);
                }
                
                let postText = '';
                if (product.price) {
                    postText = `PR Amazonで${product.title}が${product.price}で販売中。\n${affiliateLink}`;
                } else {
                    postText = `PR Amazonで${product.title}を販売中。\n${affiliateLink}`;
                }
                
                const tweetUrl = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(postText);
                window.open(tweetUrl, '_blank', 'width=550,height=420');
                
                if (markPosted) {
                    markAsPosted(product.asin, tab);
                }
                
            } catch (error) {
                showError(tab, '投稿文の生成に失敗しました: ' + error.message);
                throw error;
            }
        }
        
        function showError(tab, message) {
            const errorDiv = document.getElementById('error-' + tab);
            errorDiv.textContent = '⚠️ ' + message;
            errorDiv.classList.add('show');
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 8000);
        }
        
        function hideError(tab) {
            const errorDiv = document.getElementById('error-' + tab);
            errorDiv.classList.remove('show');
        }
        
        function showSuccess(tab, message) {
            const successDiv = document.getElementById('success-' + tab);
            successDiv.textContent = '✅ ' + message;
            successDiv.classList.add('show');
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 5000);
        }
        
        function hideSuccess(tab) {
            const successDiv = document.getElementById('success-' + tab);
            successDiv.classList.remove('show');
        }
        
        function showInfo(tab, message) {
            const infoDiv = document.getElementById('info-' + tab);
            infoDiv.textContent = 'ℹ️ ' + message;
            infoDiv.classList.add('show');
            setTimeout(() => {
                infoDiv.classList.remove('show');
            }, 5000);
        }
        
        function hideInfo(tab) {
            const infoDiv = document.getElementById('info-' + tab);
            infoDiv.classList.remove('show');
        }
    </script>
</body>
</html>
